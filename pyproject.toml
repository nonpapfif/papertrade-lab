[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrade-lab"
version = "0.1.0"
description = "Market-data-only paper trading with gated Codex reviews"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
websocket-probe = ["websockets==15.0.1"]
research = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents.git@9fa1196fffbcfd9de5146d2dd2869df84ab99838",
]

[tool.setuptools.packages.find]
include = ["papertrade*", "paper_engine*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "tradingagents.agents.schemas",
    "tradingagents.dataflows.config",
    "tradingagents.graph",
    "tradingagents.graph.conditional_logic",
    "tradingagents.graph.propagation",
]
ignore_missing_imports = true
